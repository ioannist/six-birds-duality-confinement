[[claim]]
paper_label = "thm:duality_confinement:exhaustive-squeeze"
paper_section = "ExhaustiveSqueeze"
description = "Concrete ambient exhaustive squeeze over dependent finite-dimensional response spaces, followed by measured fixed-locus confinement."
status = "theorem"
lean_subproject = "."
lean_module = "SixBirdsDualityConfinement.DualityConfinement.ConcreteHilbert"
lean_decl = "SixBirdsDualityConfinement.DualityConfinement.ConcreteHilbert.ledger_exhaustive_fixed"
