# Lean validation manifest for the duality-confinement paper axis.
#
# Each entry corresponds to a paper_label from
# formalization/inventory/duality_confinement_paper_inventory.toml whose
# intended_status is "mechanize_now". The manifest is populated
# incrementally as codex produces Lean realizations.
#
# Status meanings (verbatim from F2/F3):
# - definition:   paper definition has a Lean definition-like declaration
# - theorem:      paper claim has a Lean theorem/lemma whose dependency audit passes
# - axiomatic:    declaration is or depends on project-local axioms (NOT allowed in this repo)
# - partial:      declaration mechanizes only a supporting fragment
# - unformalized: no Lean correspondent is present yet
#
# Schema (per entry):
#   paper_label    = "<kind>:duality_confinement:<short-name>"  # from per-axis paper_inventory
#   paper_section  = "<section title>"
#   description    = "<one-line summary>"
#   status         = "<one of the values above>"
#   lean_subproject = "."                                       # single lakefile project
#   lean_module    = "SixBirdsDualityConfinement.DualityConfinement.<Section>"
#   lean_decl      = "SixBirdsDualityConfinement.DualityConfinement.<Section>.<name>"
#   notes          = ""
#
# Use `[[definition]]` for definition_kind entries, `[[claim]]` for
# theorem/lemma/proposition/corollary entries. This mirrors F2/F3's
# manifest TOML idiom.

# TODO: populate after Phase C from the per-axis paper inventory.

[[definition]]
paper_label = "def:duality_confinement:involutive-object-ledger"
paper_section = "Involution"
description = "Concrete anti-invariant readout from an isometric response involution, with finite and measured ledger realizations."
status = "definition"
lean_subproject = "."
lean_module = "SixBirdsDualityConfinement.DualityConfinement.ConcreteCore"
lean_decl = "SixBirdsDualityConfinement.DualityConfinement.ConcreteCore.psiMinus"
notes = "Use psiMinus S psi with Function.Involutive S and equivariance; pminus_idempotent, pminus_selfAdjoint and pminus_range prove projection laws. The ledger constructors are finiteLedger and measuredLedger. Legacy typed-interface declaration retained unchanged: SixBirdsDualityConfinement.DualityConfinement.Involution.InvolutiveObjectLedger."

[[definition]]
paper_label = "def:duality_confinement:separating-readout"
paper_section = "Separation"
description = "Separating anti-invariant readout with visible-support fixed-locus separation and quantitative modulus data."
status = "definition"
lean_subproject = "."
lean_module = "SixBirdsDualityConfinement.DualityConfinement.Separation"
lean_decl = "SixBirdsDualityConfinement.DualityConfinement.Separation.SeparatingReadout"
notes = "Fixed-locus and quantitative modulus laws are fields of the supplied record."

[[definition]]
paper_label = "def:duality_confinement:anti-invariant-ledger"
paper_section = "AntiInvariantLedger"
description = "Bochner integral of positive rank-one squared readouts in a finite-dimensional real response space."
status = "definition"
lean_subproject = "."
lean_module = "SixBirdsDualityConfinement.DualityConfinement.ConcreteHilbert"
lean_decl = "SixBirdsDualityConfinement.DualityConfinement.ConcreteHilbert.ledger"
notes = "Arbitrary-dimensional complete real Hilbert space, derived from SixBirdsNeedles.MainCore. Finite-dimensional proof retained as SixBirdsDualityConfinement.DualityConfinement.ConcreteMeasured.measuredLedger. Specialize r to psiMinus S psi. measuredLedger_positive proves positivity under AE strong measurability and integrability of the squared norm; finiteLedger gives the finite weighted analogue. Legacy typed-interface declaration retained unchanged: SixBirdsDualityConfinement.DualityConfinement.AntiInvariantLedger.AntiInvariantLedger."

[[claim]]
paper_label = "lem:duality_confinement:trace-identity"
paper_section = "AntiInvariantLedger"
description = "Trace of the concrete Bochner ledger equals the integral of the squared readout norm."
status = "theorem"
lean_subproject = "."
lean_module = "SixBirdsDualityConfinement.DualityConfinement.ConcreteHilbert"
lean_decl = "SixBirdsDualityConfinement.DualityConfinement.ConcreteHilbert.ledger_trace"
notes = "Arbitrary-dimensional complete real Hilbert space, derived from SixBirdsNeedles.MainCore. Finite-dimensional proof retained as SixBirdsDualityConfinement.DualityConfinement.ConcreteMeasured.measuredLedger_trace. Also SixBirdsDualityConfinement.DualityConfinement.ConcreteMeasured.measuredLedger_positive proves positivity. SixBirdsDualityConfinement.DualityConfinement.ConcreteMeasured.measuredLedger_coefficient proves the integrated matrix-coefficient formula, and SixBirdsDualityConfinement.DualityConfinement.ConcreteFinite.finiteLedger_coefficient gives the weighted finite formula. measuredLedger_ae_zero and SixBirdsDualityConfinement.DualityConfinement.ConcreteConverse.measuredLedger_zero_of_ae_zero give the zero-ledger/AE-zero directions with explicit integrability hypotheses on the forward direction. Legacy typed-interface declaration retained unchanged: SixBirdsDualityConfinement.DualityConfinement.AntiInvariantLedger.traceIdentity."

[[claim]]
paper_label = "thm:duality_confinement:separation-confinement"
paper_section = "DirectConfinement"
description = "A zero concrete Bochner ledger and AE separation imply a null nonfixed locus."
status = "theorem"
lean_subproject = "."
lean_module = "SixBirdsDualityConfinement.DualityConfinement.ConcreteHilbert"
lean_decl = "SixBirdsDualityConfinement.DualityConfinement.ConcreteHilbert.separation_confinement"
notes = "Arbitrary-dimensional complete real Hilbert space, derived from SixBirdsNeedles.MainCore. Finite-dimensional proof retained as SixBirdsDualityConfinement.DualityConfinement.ConcreteMeasured.measured_fixed_of_zero. Finite-dimensional real response; AE strong measurability and integrable squared norm are explicit. No fixed-set measurability or measure-preservation assumption is needed. finite_fixed_of_zero is the finite visible-support analogue. Legacy typed-interface declaration retained unchanged: SixBirdsDualityConfinement.DualityConfinement.DirectConfinement.separationConfinement."

[[claim]]
paper_label = "thm:duality_confinement:quantitative-confinement"
paper_section = "DirectConfinement"
description = "Concrete measured Markov bound for threshold mass in terms of the squared-readout trace and positive modulus."
status = "theorem"
lean_subproject = "."
lean_module = "SixBirdsDualityConfinement.DualityConfinement.ConcreteHilbert"
lean_decl = "SixBirdsDualityConfinement.DualityConfinement.ConcreteHilbert.quantitative_threshold"
notes = "Arbitrary-dimensional complete real Hilbert space, derived from SixBirdsNeedles.MainCore. Finite-dimensional proof retained as SixBirdsDualityConfinement.DualityConfinement.ConcreteMeasured.measured_quantitative_threshold. For arbitrary measures, the bound is mu {x | eps <= d x} <= ENNReal.ofReal (opTrace (measuredLedger mu r) / m^2), m>0. It even needs no measurability of d or positivity of eps. finite_quantitative_threshold gives the finite weighted version. Legacy typed-interface declaration retained unchanged: SixBirdsDualityConfinement.DualityConfinement.DirectConfinement.quantitativeConfinement."

