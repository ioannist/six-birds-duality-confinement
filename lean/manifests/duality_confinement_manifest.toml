[[claim]]
paper_label = "prop:duality_confinement:optimized-trace-budget"
paper_section = "DefectedBudget"
description = "Optimized concrete operator trace budget from a family of positive-parameter Loewner bounds."
status = "theorem"
lean_subproject = "."
lean_module = "SixBirdsDualityConfinement.DualityConfinement.ConcreteHilbert"
lean_decl = "SixBirdsDualityConfinement.DualityConfinement.ConcreteHilbert.ledger_optimized_budget"
