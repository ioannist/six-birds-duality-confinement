[[claim]]
paper_label = "thm:duality_confinement:douglas-domination"
paper_section = "Domination"
description = "Finite-dimensional real Douglas equivalence between Gram domination and a contractive factorization."
status = "theorem"
lean_subproject = "."
lean_module = "SixBirdsDualityConfinement.DualityConfinement.ConcreteHilbert"
lean_decl = "SixBirdsDualityConfinement.DualityConfinement.ConcreteHilbert.douglas_factorization"
notes = "Arbitrary-dimensional complete real Hilbert space, derived from SixBirdsNeedles.MainCore. Finite-dimensional proof retained as SixBirdsDualityConfinement.DualityConfinement.ConcreteDouglas.douglas_factorization. Both directions are proved. douglas_forward constructs a contraction on range W via H/ker W and extends by orthogonal projection; douglas_reverse uses the actual operator norm. Legacy typed-interface declaration retained unchanged: SixBirdsDualityConfinement.DualityConfinement.Domination.douglasDomination."

[[claim]]
paper_label = "thm:duality_confinement:master-theorem"
paper_section = "MasterTheorem"
description = "Concrete measured confinement from positive domination, an actual trace limit, and AE separation."
status = "theorem"
lean_subproject = "."
lean_module = "SixBirdsDualityConfinement.DualityConfinement.ConcreteHilbert"
lean_decl = "SixBirdsDualityConfinement.DualityConfinement.ConcreteHilbert.ledger_master_fixed"
